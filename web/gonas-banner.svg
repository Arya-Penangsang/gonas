<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)" />

  <!-- Ambient Glow -->
  <circle cx="640" cy="220" r="280" fill="#6366f1" opacity="0.18" filter="url(#blurFilter)" />
  <circle cx="280" cy="420" r="200" fill="#06b6d4" opacity="0.12" filter="url(#blurFilter)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- Logo Icon Container -->
  <rect x="580" y="80" width="120" height="120" rx="30" fill="#1e1b4b" stroke="#6366f1" stroke-width="2.5" />
  <!-- Hard Drive Icon -->
  <path d="M616 128 C616 124 620 120 624 120 L656 120 C660 120 664 124 664 128 L664 152 C664 156 660 160 656 160 L624 160 C620 160 616 156 616 152 Z" fill="none" stroke="#818cf8" stroke-width="4" />
  <rect x="604" y="115" width="72" height="50" rx="8" fill="none" stroke="#a5b4fc" stroke-width="4" />
  <circle cx="654" cy="140" r="4" fill="#38bdf8" />
  <circle cx="664" cy="140" r="4" fill="#10b981" />

  <!-- Main Title -->
  <text x="640" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="68" fill="#ffffff" letter-spacing="-1">
    Go<tspan fill="url(#accent)">NAS</tspan>
  </text>

  <!-- Tagline -->
  <text x="640" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="24" fill="#94a3b8">
    Ultra-Lightweight, High-Performance, Cross-Platform Cloud NAS
  </text>

  <!-- Pills / Feature Badges -->
  <g transform="translate(190, 385)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="200" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="22" cy="21" r="6" fill="#10b981" />
    <text x="36" y="27" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Single Binary &lt; 7MB</text>

    <!-- Pill 2 -->
    <rect x="220" y="0" width="210" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="242" cy="21" r="6" fill="#06b6d4" />
    <text x="256" y="27" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc">RAM Usage ~6.4MB</text>

    <!-- Pill 3 -->
    <rect x="450" y="0" width="210" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="472" cy="21" r="6" fill="#8b5cf6" />
    <text x="486" y="27" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Pure Go (Zero Dep)</text>

    <!-- Pill 4 -->
    <rect x="680" y="0" width="220" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="702" cy="21" r="6" fill="#f59e0b" />
    <text x="716" y="27" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Docker &amp; Multi-OS</text>
  </g>

  <!-- Supported Platforms Bar -->
  <g transform="translate(640, 490)" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#64748b">
    <text x="0" y="0">
      🐧 Linux (amd64 / arm64) &nbsp;•&nbsp; 🪟 Windows (x64) &nbsp;•&nbsp; 🍎 macOS (Apple Silicon / Intel) &nbsp;•&nbsp; 🐳 Docker &amp; HomeLab
    </text>
  </g>

  <!-- Footer Link -->
  <text x="640" y="555" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600" fill="#6366f1" letter-spacing="1">
    github.com/Arya-Penangsang/gonas
  </text>
</svg>
