<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="40%" stop-color="#0b1120" />
      <stop offset="80%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Effect Filters -->
    <filter id="glowIndigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="640" fill="url(#bg)" />

  <!-- Ambient Glowing Auras -->
  <circle cx="640" cy="180" r="260" fill="#6366f1" opacity="0.22" filter="url(#glowIndigo)" />
  <circle cx="240" cy="460" r="200" fill="#06b6d4" opacity="0.15" filter="url(#glowCyan)" />
  <circle cx="1040" cy="460" r="190" fill="#a855f7" opacity="0.14" filter="url(#glowIndigo)" />

  <!-- Technical Background Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- Top Release Pill Badge -->
  <g transform="translate(640, 58)" text-anchor="middle">
    <rect x="-145" y="0" width="290" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
    <circle cx="-120" cy="17" r="4.5" fill="#10b981" />
    <text x="-105" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1">
      v2.4 UNIVERSAL EDITION
    </text>
    <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">
      • 100% AIR-GAPPED
    </text>
  </g>

  <!-- Modern Server / NAS Cloud Glyphs -->
  <g transform="translate(640, 150)">
    <!-- Outer Glow Box -->
    <rect x="-50" y="-45" width="100" height="90" rx="24" fill="#0f172a" stroke="#6366f1" stroke-width="2.5" />
    <!-- Server Rack Top -->
    <rect x="-32" y="-28" width="64" height="22" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8" />
    <circle cx="-20" cy="-17" r="2.5" fill="#38bdf8" />
    <line x1="-12" y1="-17" x2="8" y2="-17" stroke="#4338ca" stroke-width="2" stroke-linecap="round" />
    <circle cx="20" cy="-17" r="2.5" fill="#10b981" />
    <!-- Server Rack Bottom -->
    <rect x="-32" y="2" width="64" height="22" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8" />
    <circle cx="-20" cy="13" r="2.5" fill="#f59e0b" />
    <line x1="-12" y1="13" x2="8" y2="13" stroke="#4338ca" stroke-width="2" stroke-linecap="round" />
    <circle cx="20" cy="13" r="2.5" fill="#10b981" />
  </g>

  <!-- Main Headline -->
  <text x="640" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="-1.5">
    Go<tspan fill="url(#brandGrad)">NAS</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="640" y="322" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="22" fill="#94a3b8" letter-spacing="0.2">
    Ultra-Lightweight, High-Performance, Cross-Platform Cloud Web NAS
  </text>

  <!-- 4 Core Feature Cards (Grid 2x2 or 4 Pills) -->
  <g transform="translate(140, 360)">
    <!-- Card 1: RAM & Performance -->
    <rect x="0" y="0" width="235" height="66" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="34" cy="33" r="14" fill="#065f46" opacity="0.6" />
    <text x="34" y="38" text-anchor="middle" font-size="14">⚡</text>
    <text x="58" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Single Binary &lt; 12MB</text>
    <text x="58" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#10b981">~7MB RAM • Zero External Dep</text>

    <!-- Card 2: Security & UAC -->
    <rect x="255" y="0" width="235" height="66" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="289" cy="33" r="14" fill="#312e81" opacity="0.6" />
    <text x="289" y="38" text-anchor="middle" font-size="14">🔒</text>
    <text x="313" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Multi-Role UAC &amp; Audit</text>
    <text x="313" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#818cf8">Superadmin • Admin • Staf</text>

    <!-- Card 3: Offline Air-Gapped -->
    <rect x="510" y="0" width="235" height="66" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="544" cy="33" r="14" fill="#0e7490" opacity="0.6" />
    <text x="544" y="38" text-anchor="middle" font-size="14">🛡️</text>
    <text x="568" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">100% Air-Gapped Ready</text>
    <text x="568" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#38bdf8">Bundled CSS &amp; Vector Icons</text>

    <!-- Card 4: Viewers & Telemetry -->
    <rect x="765" y="0" width="235" height="66" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="799" cy="33" r="14" fill="#701a75" opacity="0.6" />
    <text x="799" y="38" text-anchor="middle" font-size="14">📊</text>
    <text x="823" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Rich Viewers &amp; Metrics</text>
    <text x="823" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#e879f9">PDF • Word • Excel • Telemetry</text>
  </g>

  <!-- Platform Compatibility Badges -->
  <g transform="translate(640, 485)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="-310" y="-18" width="620" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="5" font-size="13.5" font-weight="600" fill="#94a3b8">
      🐧 Linux (amd64/arm64) &nbsp;•&nbsp; 🪟 Windows (x64) &nbsp;•&nbsp; 🍎 macOS (Apple Silicon/Intel) &nbsp;•&nbsp; 🐳 Docker &amp; Homelab
    </text>
  </g>

  <!-- Footer Link & Star CTA -->
  <g transform="translate(640, 560)" text-anchor="middle">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" fill="#818cf8" letter-spacing="0.5">
      github.com/Arya-Penangsang/gonas
    </text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#475569">
      Open Source • MIT License • Built with Pure Go
    </text>
  </g>
</svg>
