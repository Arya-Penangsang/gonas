<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradient: Deep Obsidian & Dark Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Brand Typography & Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Icon Glow & Background -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Blur Filters for Ambient Light -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="95" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />

  <!-- Ambient Light Mesh (Soft & Elegant) -->
  <circle cx="640" cy="220" r="320" fill="#4f46e5" opacity="0.18" filter="url(#ambientGlow)" />
  <circle cx="360" cy="400" r="220" fill="#0284c7" opacity="0.10" filter="url(#ambientGlow)" />
  <circle cx="920" cy="400" r="220" fill="#7c3aed" opacity="0.12" filter="url(#ambientGlow)" />

  <!-- Clean Subtle Engineering Grid (Very low opacity for depth) -->
  <g opacity="0.035" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- Central Hero Element -->
  <g transform="translate(640, 140)">
    <!-- Sleek Rounded Icon Card -->
    <rect x="-48" y="-48" width="96" height="96" rx="26" fill="url(#iconBg)" stroke="#6366f1" stroke-width="2" stroke-opacity="0.6" />
    
    <!-- Modern Storage / Cloud Icon (Clean Vector Geometry) -->
    <g transform="translate(0, 0)" stroke-linecap="round" stroke-linejoin="round">
      <!-- Top Drive Unit -->
      <rect x="-24" y="-22" width="48" height="18" rx="5" fill="#312e81" fill-opacity="0.5" stroke="#a5b4fc" stroke-width="2" />
      <circle cx="-14" cy="-13" r="2" fill="#38bdf8" />
      <line x1="-6" y1="-13" x2="8" y2="-13" stroke="#818cf8" stroke-width="2" />
      <circle cx="14" cy="-13" r="2" fill="#10b981" />

      <!-- Bottom Drive Unit -->
      <rect x="-24" y="4" width="48" height="18" rx="5" fill="#312e81" fill-opacity="0.5" stroke="#a5b4fc" stroke-width="2" />
      <circle cx="-14" cy="13" r="2" fill="#818cf8" />
      <line x1="-6" y1="13" x2="8" y2="13" stroke="#818cf8" stroke-width="2" />
      <circle cx="14" cy="13" r="2" fill="#10b981" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(640, 275)" text-anchor="middle">
    <!-- Main Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="70" fill="#ffffff" letter-spacing="-1.5">
      Go<tspan fill="url(#textGrad)">NAS</tspan>
    </text>
    
    <!-- Tagline (Crisp & Readable) -->
    <text y="52" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="22" fill="#94a3b8" letter-spacing="-0.2">
      Lightweight, High-Performance Cloud Storage &amp; Web File Manager in Pure Go
    </text>
  </g>

  <!-- 4 Clean Minimalist Feature Badges (Horizontal Row with Ample Breathing Room) -->
  <g transform="translate(640, 395)" text-anchor="middle">
    <!-- Badge 1: Low RAM -->
    <g transform="translate(-360, 0)">
      <rect x="-105" y="-18" width="210" height="38" rx="19" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="-80" cy="1" r="4.5" fill="#10b981" />
      <text x="-65" y="6" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        &lt; 10 MB RAM Footprint
      </text>
    </g>

    <!-- Badge 2: Single Binary -->
    <g transform="translate(-120, 0)">
      <rect x="-105" y="-18" width="210" height="38" rx="19" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="-80" cy="1" r="4.5" fill="#6366f1" />
      <text x="-65" y="6" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        Single Static Binary
      </text>
    </g>

    <!-- Badge 3: Multi-Role UAC -->
    <g transform="translate(120, 0)">
      <rect x="-105" y="-18" width="210" height="38" rx="19" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="-80" cy="1" r="4.5" fill="#38bdf8" />
      <text x="-65" y="6" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        Enterprise UAC &amp; Audit
      </text>
    </g>

    <!-- Badge 4: Air-Gapped Ready -->
    <g transform="translate(360, 0)">
      <rect x="-105" y="-18" width="210" height="38" rx="19" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="-80" cy="1" r="4.5" fill="#f59e0b" />
      <text x="-65" y="6" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        100% Air-Gapped Ready
      </text>
    </g>
  </g>

  <!-- Platform Compatibility Line -->
  <g transform="translate(640, 485)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text font-size="14.5" font-weight="500" fill="#64748b" letter-spacing="0.3">
      Linux &nbsp;•&nbsp; Windows &nbsp;•&nbsp; macOS &nbsp;•&nbsp; Docker &nbsp;•&nbsp; Raspberry Pi
    </text>
  </g>

  <!-- Bottom Elegant Footer -->
  <g transform="translate(640, 565)" text-anchor="middle">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#818cf8" letter-spacing="0.8">
      github.com/Arya-Penangsang/gonas
    </text>
  </g>
</svg>
