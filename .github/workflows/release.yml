name: 🚀 Release Multi-Platform Binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - goos: windows
            goarch: amd64
            goarm: ""
            ext: .exe
            archive: zip
          - goos: windows
            goarch: arm64
            goarm: ""
            ext: .exe
            archive: zip
          # Linux
          - goos: linux
            goarch: amd64
            goarm: ""
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            goarm: ""
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
            archive: tar.gz
          # macOS
          - goos: darwin
            goarch: amd64
            goarm: ""
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            goarm: ""
            ext: ""
            archive: tar.gz

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: 🔨 Compile Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          TAG_NAME="${{ github.ref_name }}"
          TARGET_NAME="gonas-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-armv{0}', matrix.goarm) || '' }}"
          BIN_NAME="gonas${{ matrix.ext }}"
          
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${TAG_NAME}" -o "dist/${BIN_NAME}" .
          
          cd dist
          cp ../LICENSE .
          cp ../README.md .
          
          if [ "${{ matrix.archive }}" = "zip" ]; then
            sudo apt-get install -y zip
            zip "${TARGET_NAME}.zip" "${BIN_NAME}" LICENSE README.md
            sha256sum "${TARGET_NAME}.zip" > "${TARGET_NAME}.zip.sha256"
          else
            tar -czvf "${TARGET_NAME}.tar.gz" "${BIN_NAME}" LICENSE README.md
            sha256sum "${TARGET_NAME}.tar.gz" > "${TARGET_NAME}.tar.gz.sha256"
          fi

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-armv{0}', matrix.goarm) || '' }}
          path: dist/*.*

  publish-release:
    name: 📢 Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 📝 Generate Combined Checksums
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GoNAS ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
