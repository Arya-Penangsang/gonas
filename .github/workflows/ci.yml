name: 🧪 Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: [ "1.23" ]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐹 Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: 🔍 Run Go Vet
        run: go vet ./...

      - name: 🧪 Run Unit Tests
        run: go test -v -race ./...
        if: runner.os != 'Windows' # race detector is faster on linux runner

      - name: 🧪 Run Unit Tests (Windows)
        run: go test -v ./...
        if: runner.os == 'Windows'

      - name: 🏗️ Verify Go Build
        run: go build -v -ldflags="-s -w" -o gonas_bin .
